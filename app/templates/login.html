{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>

    <p class="muted">
        Login to continue to your
        PocketSmart dashboard.
    </p>

    <form id="loginForm">

        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button>
            Login
        </button>


        <p
            id="message"
            class="message"
        ></p>

    </form>


    <p>

        New user?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();

            const form =
                new FormData(e.target);

            const res =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            Object.fromEntries(form)
                        )
                    }
                );

            const data =
                await res.json();

            if (res.ok) {

                location.href =
                    "/dashboard";

            } else {

                document
                    .getElementById("message")
                    .textContent =
                        data.detail ||
                        "Login failed";
            }
        }
    );

</script>

{% endblock %}
