{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <h1>
        Create account
    </h1>

    <p class="muted">

        Your recommendation history
        is saved to your local database.

    </p>


    <form id="registerForm">

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >

        </label>


        <button>
            Register
        </button>


        <p
            id="message"
            class="message"
        ></p>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();

            const form =
                new FormData(e.target);

            const res =
                await fetch(
                    "/api/register",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            Object.fromEntries(form)
                        )
                    }
                );

            const data =
                await res.json();

            if (res.ok) {

                location.href =
                    "/login";

            } else {

                document
                    .getElementById("message")
                    .textContent =
                        data.detail ||
                        "Registration failed";
            }
        }
    );

</script>

{% endblock %}
