<!doctype html>

<html lang="en">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ title or "PocketSmart AI" }}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a

        href="/dashboard"
    >
        PocketSmart

    </a>

    <nav>

            Dashboard
        </a>

        {% if user %}

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        </a>

        </a>

</header>


<main class="container">

    {% endblock %}

</main>


<script src="/static/js/app.js"></script>

</body>

</html>
